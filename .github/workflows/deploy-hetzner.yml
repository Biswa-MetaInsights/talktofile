name: Deploy Talktofile to Hetzner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talktofile-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_HOST_KEY: ${{ secrets.HETZNER_SSH_HOST_KEY }}
        run: |
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_HOST_KEY"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.HETZNER_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy approved main revision
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_PATH: ${{ vars.HETZNER_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 deploy@"$SSH_HOST" "cd '$DEPLOY_PATH' && git fetch origin main && git checkout main && git pull --ff-only origin main && docker compose up -d --build && docker compose ps"
